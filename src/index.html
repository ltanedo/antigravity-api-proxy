<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Proxy Tray</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 183, 94, 0.3), transparent 40%),
          linear-gradient(135deg, #10151f, #1b2739 60%, #121921);
        color: #eef4ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(420px, calc(100vw - 32px));
        padding: 24px;
        border-radius: 18px;
        background: rgba(12, 18, 28, 0.82);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: rgba(238, 244, 255, 0.8);
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
        color: #ffd18a;
      }
      button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; }
      button:focus-visible, input:focus-visible { outline: 3px solid #ffd18a; outline-offset: 3px; }
      .actions { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
      #accounts { background: #ffd18a; color: #10151f; }
      label { display: flex; align-items: center; gap: 8px; }
      #status { min-height: 3em; margin-top: 12px; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Antigravity Proxy Tray</h1>
      <p>
        Your local proxy is starting. Open Accounts to connect your Google account.
        It keeps running in the system tray when you close this window.
      </p>
      <div class="actions">
        <button id="accounts" type="button">Open Accounts</button>
        <button id="hide" type="button">Continue in tray</button>
      </div>
      <label><input id="autostart" type="checkbox" disabled /> Start with Windows</label>
      <p id="status" role="status" aria-live="polite">Left-click the tray icon to open the dashboard. Right-click for settings or Quit.</p>
    </main>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const checkbox = document.getElementById('autostart');
      const status = document.getElementById('status');
      const report = error => { status.textContent = String(error); };
      document.getElementById('accounts').addEventListener('click', () => invoke('open_accounts').catch(report));
      document.getElementById('hide').addEventListener('click', () => invoke('hide_welcome').catch(report));
      checkbox.addEventListener('change', async () => {
        checkbox.disabled = true;
        try {
          await invoke('set_autostart', { enabled: checkbox.checked });
          status.textContent = checkbox.checked ? 'The tray will start when you sign in to Windows.' : 'Start with Windows is off.';
        } catch (error) {
          checkbox.checked = !checkbox.checked;
          report(error);
        } finally { checkbox.disabled = false; }
      });
      (async () => {
        await listen('autostart-changed', event => { checkbox.checked = event.payload; });
        await listen('autostart-error', event => report(event.payload));
        checkbox.checked = await invoke('autostart_enabled');
        checkbox.disabled = false;
      })().catch(report);
    </script>
  </body>
</html>
