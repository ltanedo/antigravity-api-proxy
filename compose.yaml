name: antigravity-proxy-container
services:
  proxy:
    image: antigravity-proxy:0.4.0-local
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:${ANTIGRAVITY_HTTP_PORT:-8086}:8086"
      - "127.0.0.1:38080:38080"
    volumes:
      - proxy-home:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  proxy-home:
